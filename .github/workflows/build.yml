name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Android SDK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zlib1g-dev libncurses5-dev libssl-dev unzip zip def2pass libffi-dev cmake ace-of-cups
          pip install --upgrade pip
          pip install cython==0.29.33 virtualenv

      - name: Build APK with Buildozer Action
        uses: ArtemGovorov/buildozer-action@v1.5.0
        with:
          command: buildozer -v android debug
